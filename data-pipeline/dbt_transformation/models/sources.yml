# models/sources.yml
version: 2

sources:
  - name: social_raw
    database: uni-feedback-data
    schema: social_raw
    tables:
      - name: posts
        columns:
          - name: id
            data_type: int64
          - name: author
            data_type: string
          - name: post_date
            data_type: timestamp
          - name: post_link
            data_type: string
          - name: content
            data_type: string
          - name: stats
            data_type: record
          - name: stats.reactions
            description: ""
          - name: stats.comments
            description: ""
          - name: crawled_at
            data_type: timestamp
      - name: comments
        columns:
          - name: comment_id
            data_type: string
          - name: post_id
            data_type: string
          - name: parent_comment_id
            data_type: string
          - name: author
            data_type: string
          - name: content
            data_type: string
          - name: reaction_count
            data_type: int64
          - name: commented_at
            data_type: timestamp
          - name: crawled_at
            data_type: timestamp
  - name: ai_raw
    database: uni-feedback-data
    schema: ai_raw
    tables:
      - name: post_analysis
        columns:
          - name: post_id
            data_type: string
          - name: topic
            data_type: string
          - name: sentiment_score
            data_type: float64
          - name: ai_summary
            data_type: string
          - name: analyzed_at
            data_type: timestamp
      - name: comment_analysis
        columns:
          - name: comment_id
            data_type: string
          - name: post_id
            data_type: string
          - name: sentiment_label
            data_type: string
          - name: sentiment_score
            data_type: float64
          - name: is_top_concern
            data_type: bool
          - name: analyzed_at
            data_type: timestamp
      - name: post_comments_summary
        columns:
          - name: post_id
            data_type: string
          - name: comments_summary
            data_type: string
          - name: urgency_level
            data_type: string
          - name: negative_comments_ratio
            data_type: float64
          - name: analyzed_at
            data_type: timestamp
