version: 2

models:
  - name: mrt_post_comments_detail
    description: "Detailed mart of comments joined with AI sentiment insights, ready to be reverse-ETLed to PostgreSQL."
    columns:
      - name: comment_id
        data_type: string
        description: "Unique comment ID."
        tests:
          - unique
          - not_null

      - name: post_id
        data_type: string
        description: "Parent post ID."
        tests:
          - not_null

      - name: parent_comment_id
        data_type: string
        description: "Parent comment ID for replies."

      - name: author
        data_type: string
        description: "Author display name."

      - name: content
        data_type: string
        description: "Full text content."

      - name: reaction_count
        data_type: int64
        description: "Reaction count."

      - name: commented_at
        data_type: timestamp
        description: "Original comment timestamp."

      - name: sentiment_label
        data_type: string
        description: "Sentiment label."

      - name: sentiment_score
        data_type: float64
        description: "Sentiment score."

      - name: is_top_concern
        data_type: bool
        description: "Whether comment mentions crucial evidence."

      - name: analyzed_at
        data_type: timestamp
        description: "Timestamp of AI analysis."

      - name: crawled_at
        data_type: timestamp
        description: "Timestamp when comment was scraped."
