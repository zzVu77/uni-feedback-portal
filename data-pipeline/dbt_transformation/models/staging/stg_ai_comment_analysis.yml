version: 2

models:
  - name: stg_ai_comment_analysis
    description: "Staging model for AI sentiment and crisis concern analysis performed on individual comments."
    columns:
      - name: comment_id
        data_type: string
        description: "Unique comment ID reference."
        tests:
          - unique
          - not_null

      - name: post_id
        data_type: string
        description: "Parent post ID."
        tests:
          - not_null

      - name: sentiment_label
        data_type: string
        description: "Sentiment label: Tiêu cực, Tích cực, Trung lập, Bức xúc."

      - name: sentiment_score
        data_type: float64
        description: "Score between -1.0 and 1.0."

      - name: is_top_concern
        data_type: bool
        description: "Indicates whether comment contains actionable evidence or severe complaints."

      - name: analyzed_at
        data_type: timestamp
        description: "Timestamp when analysis occurred."
